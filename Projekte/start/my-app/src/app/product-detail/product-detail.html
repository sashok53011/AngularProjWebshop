<!-- Das product-Detail-Template zeigt die Details des ausgewählten Produkts an, wenn ein Produkt ausgewählt ist.
Die Kommunikation zwischen der ProductList-Komponente und der ProductDetail-Komponente erfolgt über ein Signal,
das das ausgewählte Produkt darstellt. -->

@let product = (product$ | async); <!-- Lokale Variable für das ausgewählte Produkt, bessere Lesbarkeit, Performance -->

@if (product) {
    <p>You selected: <strong>{{ product.title }}</strong></p>
    <p>{{product.price | currency: 'EUR'}}</p>
    <input placeholder="New price" #price type="number" />
      <button
        class="secondary"
          (click)="changePrice(product, price.value)">
            Change
      </button>
    <div class="pill-group">
      <p class="pill">{{product.category}}</p>
    </div>
    <div class="button-group">
@if (authService.isLoggedIn()) {   
    <button (click)="addToCart()">Add to Cart</button>
}
    <button class="delete" (click)="remove(product)">Delete</button>
    </div>
    <!-- <input appNumeric/> -->
}
