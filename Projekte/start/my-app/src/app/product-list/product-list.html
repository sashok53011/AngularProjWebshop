
 <!-- @let products = (products$ | async) ?? []; -->
 <!-- Nullish Coalescing Operator ?? [], wenn Daten noch
  nicht geladen, gib leeres Array zurück, @empty -->

@if (products()) {
    <h1>Products ({{ products().length }})</h1>
}
<ul class="pill-group">
    @for (product of products() | sort; track product.id) {
        <li class="pill" (click)="selectedProduct = product">
            @switch (product.category) {
                @case ('electronics') { ⌨️ }
                @case ('jewelery') { 💎 }
                @default { 🏷️ }
            }
            {{ product?.title }}
        </li>
    }
     @empty {
        <p>No products available.</p>
}
</ul>

<app-product-detail
 [id]="selectedProduct?.id"
 (added)="onAdded()"
></app-product-detail>
<app-product-create></app-product-create>
